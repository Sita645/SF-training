<template>

    <lightning-card title="Student Profile">

        <div class="slds-p-around_medium">

            <!-- Student Record ID -->

            <lightning-input
                type="text"
                label="Student Record ID"
                placeholder="Enter Student Record ID"
                value={studentRecordId}
                onchange={handleStudentIdChange}>
            </lightning-input>


            <!-- Load Profile Button -->

            <div class="slds-m-top_medium">

                <lightning-button
                    variant="brand"
                    label="Load Profile"
                    onclick={handleLoadProfile}>
                </lightning-button>

            </div>


            <!-- Error Before Loading -->

            <template if:true={errorMessage}>

                <div class="slds-m-top_medium">

                    <p class="slds-text-color_error">
                        {errorMessage}
                    </p>

                </div>

            </template>


            <!-- Profile Form -->

            <template if:true={showForm}>

                <div class="slds-m-top_large">

                    <lightning-record-edit-form
                        record-id={studentRecordId}
                        object-api-name="Student__c"
                        onsuccess={handleSuccess}
                        onerror={handleError}>

                        <!-- Student Name -->

                        <lightning-input-field
                            field-name="Name">
                        </lightning-input-field>


                        <!-- Student ID -->

                        <lightning-input-field
                            field-name="Student_ID__c"
                            disabled>
                        </lightning-input-field>


                        <!-- Email -->

                        <lightning-input-field
                            field-name="Email__c"
                            required>
                        </lightning-input-field>


                        <!-- Department -->

                        <lightning-input-field
                            field-name="Department__c"
                            required>
                        </lightning-input-field>


                        <!-- CGPA -->

                        <lightning-input-field
                            field-name="CGPA__c"
                            required>
                        </lightning-input-field>


                        <!-- Active Backlogs -->

                        <lightning-input-field
                            field-name="Active_Backlogs__c"
                            required>
                        </lightning-input-field>


                        <!-- Batch Year -->

                        <lightning-input-field
                            field-name="Batch_Year__c"
                            required>
                        </lightning-input-field>


                        <!-- Save -->

                        <div class="slds-m-top_medium">

                            <lightning-button
                                type="submit"
                                variant="brand"
                                label="Save Profile">
                            </lightning-button>

                        </div>

                    </lightning-record-edit-form>

                </div>

            </template>


            <!-- Success -->

            <template if:true={successMessage}>

                <div class="slds-m-top_medium">

                    <p class="slds-text-color_success">
                        ✓ {successMessage}
                    </p>

                </div>

            </template>

        </div>

    </lightning-card>

</template>
